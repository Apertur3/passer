<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>genart checks</title>
<style>body{font:14px/1.4 ui-monospace,monospace;margin:16px;background:#E4E2DD;color:#1B1A18}table{border-collapse:collapse}td,th{border:1px solid #9E9C98;padding:3px 8px;text-align:left}.PASS{background:#c9d8c3}.FAIL{background:#e3b7a8}.INFO{background:#ddd}</style>
<h1>Acceptance checks</h1><p id="sum">running...</p>
<table id="t"><tr><th>piece</th><th>theme</th><th>check</th><th>result</th><th>detail</th></tr></table>
<script type="module">
// Each piece is imported from its built module: the same text the dist html inlines.
const THEMES = ['mono', 'fieldnotes', 'night'], rows = [];
const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
const px = cv => cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
const same = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const pct = (a, p) => [...a].sort((x, y) => x - y)[Math.min(a.length - 1, Math.floor(a.length * p))];
function add(piece, theme, check, ok, detail) {
  rows.push({ piece, theme, check, ok, detail });
  document.getElementById('t').insertAdjacentHTML('beforeend', `<tr><td>${piece}</td><td>${theme}</td><td>${check}</td><td class="${ok === null ? 'INFO' : ok ? 'PASS' : 'FAIL'}">${ok === null ? 'INFO' : ok ? 'PASS' : 'FAIL'}</td><td>${detail}</td></tr>`);
}
const segDist = (p, a, b) => { // distance from colour p to the segment a-b in RGB
  const ab = b.map((v, i) => v - a[i]), L = ab.reduce((s, v) => s + v * v, 0) || 1;
  const k = Math.max(0, Math.min(1, p.reduce((s, v, i) => s + (v - a[i]) * ab[i], 0) / L));
  return Math.hypot(...p.map((v, i) => v - a[i] - k * ab[i]));
};
const pieces = await (await fetch('pieces.json')).json();
for (const meta of pieces) {
  const M = await import('./' + meta.module), P = { meta: M.meta, draw: M.draw }, id = meta.id, T = M.meta.T;
  const R = (cv, o) => M.render(P, cv.getContext('2d'), { seed: 'a', t: 3.3, w: cv.width, h: cv.height, theme: 'mono', ...o });
  add(id, '-', 'payload', meta.bytes < 30720, meta.bytes + ' bytes (limit 30720)');
  for (const theme of THEMES) {
    // 1 deterministic
    let a = mk(400, 500), b = mk(400, 500), c = mk(400, 500);
    R(a, { theme }); R(b, { theme }); R(c, { theme, seed: 'b' });
    add(id, theme, '1 deterministic', same(px(a), px(b)) && !same(px(a), px(c)), 'same seed identical, other seed differs');
    // 2 seamless
    const f0 = mk(400, 500), fT = mk(400, 500), fe = mk(400, 500);
    R(f0, { theme, t: 0 }); R(fT, { theme, t: T }); R(fe, { theme, t: T - 1 / 30 });
    const d0 = px(f0), dE = px(fe); let diff = 0; for (let i = 0; i < d0.length; i += 4) if (d0[i] !== dE[i]) diff++;
    add(id, theme, '2 seamless', same(d0, px(fT)), `frame(0)==frame(T); frame(T-1/30) differs in ${(100 * diff / (d0.length / 4)).toFixed(2)}% of pixels`);
    // 5 perf: 700 CSS px wide at DPR 2, 4:5
    const pc = mk(1400, 1750); let dt = 0; const timed = { meta: M.meta, draw: (...x) => { const s = performance.now(); M.draw(...x); dt += performance.now() - s; } };
    const drawMs = [], totMs = [];
    for (let i = 0; i < 120; i++) { dt = 0; const s = performance.now(); M.render(timed, pc.getContext('2d'), { seed: 'a', t: i / 6, w: 1400, h: 1750, theme }); totMs.push(performance.now() - s); drawMs.push(dt); }
    const wall = []; for (let i = 0; i < 30; i++) { const s = performance.now(); M.render(P, pc.getContext('2d'), { seed: 'a', t: i / 6, w: 1400, h: 1750, theme }); pc.getContext('2d').getImageData(0, 0, 1, 1); wall.push(performance.now() - s); }
    const dm = pct(drawMs, .5), dp = pct(drawMs, .95), tm = pct(totMs, .5), tp = pct(totMs, .95);
    add(id, theme, '5 perf', dm <= 3 && dp <= 6, `draw median ${dm.toFixed(2)} ms, p95 ${dp.toFixed(2)} ms (budget 3 / 6); incl. paper+grain median ${tm.toFixed(2)}, p95 ${tp.toFixed(2)}; with GPU flush (wall) median ${pct(wall, .5).toFixed(2)}, p95 ${pct(wall, .95).toFixed(2)}`);
    // 7 palette
    const pal = mk(400, 500); R(pal, { theme, t: M.meta.still * T }); const d = px(pal), col = M.theme(theme);
    if (theme === 'mono') {
      let mx = 0; for (let i = 0; i < d.length; i += 4) mx = Math.max(mx, Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]));
      add(id, theme, '7 palette', mx <= 12, `max channel spread ${mx}/255 (paper itself is 7, ink 3; spec's HSL saturation 0.04 would fail the theme's own colours)`);
    } else {
      const [pa, ink, ac, co] = [col.paper, col.ink, col.accent, col.cool].map(rgb), segs = [[pa, ink], [pa, ac], [pa, co], [ink, ac], [ink, co]];
      let bad = 0, nonPaper = 0, accent = 0;
      for (let i = 0; i < d.length; i += 4) {
        const p = [d[i], d[i + 1], d[i + 2]];
        if (Math.min(...segs.map(s => segDist(p, ...s))) > 14) bad++;
        if (Math.hypot(...p.map((v, k) => v - pa[k])) > 40) { nonPaper++; if (segDist(p, pa, ac) < segDist(p, pa, ink) && segDist(p, pa, ac) < segDist(p, pa, co)) accent++; }
      }
      const share = accent / Math.max(1, nonPaper);
      add(id, theme, '7 palette', bad / (d.length / 4) < 0.001 && share <= 0.05, `${bad} off-palette px; accent ${(100 * share).toFixed(2)}% of ink pixels (max 5%)`);
    }
    // 9 reduced motion: exactly one frame, equal to the exported still
    const host = Object.assign(document.createElement('div'), {}); host.style.width = '300px'; document.body.append(host);
    const inst = M.mount(host, { seed: 'a', theme, reduce: true }); await new Promise(r => setTimeout(r, 500));
    const ref = mk(inst.canvas.width, inst.canvas.height); R(ref, { theme, t: M.meta.still * T });
    add(id, theme, '9 reduced motion', inst.frames === 1 && same(px(inst.canvas), px(ref)), `${inst.frames} frame drawn, equals still frame: ${same(px(inst.canvas), px(ref))}`);
    inst.destroy(); host.remove();
    await new Promise(r => setTimeout(r));
  }
}
const fails = rows.filter(r => r.ok === false).length;
document.getElementById('sum').textContent = fails ? `${fails} FAILED of ${rows.length}` : `ALL PASS (${rows.length} checks)`;
window.__results = rows; document.title = 'genart checks: ' + (fails ? 'FAIL' : 'PASS');
</script>
